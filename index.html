<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF5EC" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habibi" />
    <meta name="description" content="A private, offline-first habit tracker." />
    <link rel="canonical" href="https://habibi.vaneyghen.be/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=1.16" />
    <title>Habibi</title>
  </head>
  <body>
    <main id="app" aria-label="Habibi habit tracker">
      <header class="header">
        <div class="title-row">
          <div class="title-block">
            <button id="year-button" class="year-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <span id="year-title"></span>
              <span class="tiny-chevron" data-icon="chevron-down"></span>
            </button>
            <p id="stats-line" class="stats-line"></p>
          </div>
          <div class="header-actions">
          <button id="overview-button" class="settings-button" type="button" aria-label="Habits not done in a while" title="Habits not done in a while">
            <span data-icon="clock"></span>
          </button>
          <button id="settings-button" class="settings-button" type="button" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">
            <span data-icon="settings"></span>
          </button>
          </div>
        </div>

        <nav id="habit-picker" class="habit-picker" aria-label="Habits"></nav>
      </header>

      <div class="weekday-row" aria-hidden="true">
        <span class="month-spacer"></span>
        <span>M</span><span>T</span><span>W</span><span>T</span>
        <span>F</span><span>S</span><span>S</span>
      </div>

      <section id="calendar-scroll" class="calendar-scroll" aria-label="Year calendar">
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <section id="overview-page" class="overview-page" aria-labelledby="overview-title" hidden>
        <button id="overview-back" class="habit-pill" type="button"><span data-icon="arrow-left"></span>Calendar</button>
        <h1 id="overview-title" tabindex="-1">Not done in a while</h1>
        <p class="overview-copy">Good habits, longest ago first. Never-done habits appear at the top.</p>
        <ol id="overview-list" class="overview-list"></ol>
      </section>

      <div id="popover-layer" class="popover-layer" hidden></div>
      <div id="modal-layer" class="modal-layer" hidden></div>
      <canvas id="celebration-canvas" class="celebration-canvas" aria-hidden="true"></canvas>
      <audio id="completion-sound" src="./assets/sounds/completion.mp3" preload="auto" playsinline hidden></audio>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <input id="import-input" type="file" accept="application/json,.json" hidden />
    </main>
    <script type="module" src="./app.mjs?v=1.16"></script>
  </body>
</html>
